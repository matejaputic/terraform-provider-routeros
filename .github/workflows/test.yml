name: Framework slice verification
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.7'
      - name: Offline discovery, adaptation and independent specification gates
        run: make testdiscovery testschema testmaintenance testcontracts testchr
      - name: Deterministic official generation
        run: |
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated
      - name: Unit and mock Terraform lifecycle tests (not live acceptance)
        env:
          TF_ACC_TERRAFORM_VERSION: '1.14.0'
        run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build .
      - run: terraform fmt -check -recursive examples
  pinned-chr:
    name: CHR acceptance (${{ matrix.version }} x86_64/base)
    strategy:
      fail-fast: false
      matrix:
        version: ['7.24.5', '7.25beta5']
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'matejaputic/terraform-provider-routeros'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.7'
      - name: Disposable pinned-version CHR full reviewed-resource acceptance
        env:
          CHR_VERSION: ${{ matrix.version }}
        shell: bash
        run: |
          trap 'python3 tools/chr/chr.py stop' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          python3 tools/chr/chr.py start --hosted --version "$CHR_VERSION"
          python3 tools/chr/chr.py test --version "$CHR_VERSION"
      - name: Ensure owned guest, credentials and mutable disk are removed
        if: always()
        run: python3 tools/chr/chr.py stop
      - name: Retain only redacted target provenance (not credentials or serial buffers)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chr-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/chr/target.json
            .local/chr/acceptance-evidence.json
            .local/chr/diagnostics.json
            .local/chr/build.log
          if-no-files-found: warn
          retention-days: 90
