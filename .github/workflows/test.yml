name: Framework slice verification
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.7'
      - name: Offline discovery, adaptation and independent specification gates
        run: make testdiscovery testschema testmaintenance
      - name: Deterministic official generation
        run: |
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated
      - name: Unit and mock Terraform lifecycle tests (not live acceptance)
        env:
          TF_ACC_TERRAFORM_VERSION: '1.14.0'
        run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build .
      - run: terraform fmt -check -recursive examples
