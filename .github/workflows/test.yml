name: Framework resource verification
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install pinned Python quality tooling
        run: |
          python3 -m pip install uv==0.12.23
          uv sync --locked
      - name: Python lint, formatting and type checks
        run: make lintpython
      - name: Offline discovery, adaptation and independent specification gates
        run: make testdiscovery testschema testmaintenance testcontracts testchr testdocs
      - name: Deterministic official generation
        run: |
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated internal/provider/extended_collection_bindings.go internal/provider/additional_settings_bindings.go
          bash tools/schema/generate.sh
          git diff --exit-code -- schemas internal/generated internal/provider/extended_collection_bindings.go internal/provider/additional_settings_bindings.go
      - name: Unit and mock Terraform lifecycle tests (not live acceptance)
        env:
          TF_ACC_TERRAFORM_VERSION: '1.14.0'
        run: go test -race -count=1 -timeout=300s ./...
      - run: go vet ./...
      - run: go build .
      - run: terraform fmt -check -recursive examples
  pinned-chr:
    name: CHR acceptance (${{ matrix.version }} x86_64/${{ matrix.flavor }})
    strategy:
      fail-fast: false
      matrix:
        version: ['7.24.5', '7.25beta5']
        flavor: ['base', 'routeros+container']
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'matejaputic/terraform-provider-routeros'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Disposable pinned-version CHR full reviewed-resource acceptance
        env:
          CHR_VERSION: ${{ matrix.version }}
          CHR_FLAVOR: ${{ matrix.flavor }}
        shell: bash
        run: |
          trap 'python3 tools/chr/chr.py stop' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          extra=()
          if [[ "$CHR_FLAVOR" == 'routeros+container' ]]; then extra=(--container); fi
          python3 tools/chr/chr.py start --hosted --version "$CHR_VERSION" "${extra[@]}"
          python3 tools/chr/chr.py test --version "$CHR_VERSION"
      - name: Ensure owned guest, credentials and mutable disk are removed
        if: always()
        run: python3 tools/chr/chr.py stop
      - name: Retain only redacted target provenance (not credentials or serial buffers)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chr-${{ matrix.version }}-${{ matrix.flavor }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/chr/target.json
            .local/chr/acceptance-evidence.json
            .local/chr/diagnostics.json
            .local/chr/build.log
          if-no-files-found: warn
          retention-days: 90
