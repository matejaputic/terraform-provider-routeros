name: Immutable provider maintenance (offline candidates)
on:
  schedule:
    - cron: '30 7 * * 1' # Weekly: Monday at 07:30 UTC
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional immutable restraml SHA (empty resolves main once)'
        type: string
        default: ''
      extra:
        description: 'Also generate extra-package candidates (not live certification)'
        type: boolean
        default: false
      nightly:
        description: 'Include RouterOS nightly train; stale provenance fails'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: routeros-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Install pinned Python quality tooling
        run: |
          python3 -m pip install uv==0.12.23
          uv sync --locked
      - name: Discover immutable snapshots, generate twice, verify and build isolated candidates
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          INCLUDE_EXTRA: ${{ inputs.extra }}
          INCLUDE_NIGHTLY: ${{ inputs.nightly }}
        shell: bash
        run: |
          args=()
          if [[ -n "$UPSTREAM_SHA" ]]; then args+=(--sha "$UPSTREAM_SHA"); fi
          if [[ "$INCLUDE_EXTRA" == true ]]; then args+=(--extra); fi
          if [[ "$INCLUDE_NIGHTLY" == true ]]; then args+=(--nightly); fi
          python3 tools/maintenance/maintain.py "${args[@]}"
      - name: Export verified offline recovery bundle
        run: |
          mkdir -p .local/recovery
          python3 tools/maintenance/bundle.py export \
            --output .local/maintenance --archive .local/recovery/bundle.tar \
            > .local/recovery/bundle.sha256
          cp .local/maintenance/latest-summary.json .local/recovery/summary.json
      - name: Transfer recovery bundle (not permanent storage)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/recovery/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error
      - name: Summarize actual stage coverage (never infer live compatibility)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('.local/maintenance/latest-summary.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Artifact-only maintenance\n\nNo live-target compatibility or release publication is certified by this job.\n\n')
              if p.exists():
                  s = json.loads(p.read_text())
                  out.write('Outcome: `' + s['outcome'] + '`\n\n')
                  out.write('| RouterOS | Flavor | Stage |\n|---|---|---|\n')
                  for c in s['candidates']:
                      out.write('| ' + c['version'] + ' | ' + c['flavor'] + ' | ' + c['status'] + ' |\n')
              else:
                  out.write('No completed summary; inspect failed setup/discovery step.\n')
          PY
      - name: Retain immutable evidence, raw inputs, checkpoints and candidate builds
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/maintenance/latest-summary.json
            .local/maintenance/checkpoints.json
            .local/maintenance/candidates/
            .local/maintenance/runs/
          if-no-files-found: warn
          # Only the dedicated offline maintenance tree, never .local/chr credentials/disks.
          include-hidden-files: true
          retention-days: 90
  recovery-proof:
    needs: candidates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/recovery
      - name: Independently restore and verify unchanged immutable discovery on a fresh runner
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'tools/maintenance')
          import bundle, maintain
          transfer = Path('.local/recovery')
          output = Path('.local/restored')
          bundle.restore(transfer / 'bundle.tar', output,
                         (transfer / 'bundle.sha256').read_text().strip())
          previous = json.loads((transfer / 'summary.json').read_text())
          manifest = next((output / 'runs' / previous['run_id'] / 'discovery').glob('manifest.json'))
          saved = json.loads(manifest.read_text())
          result = maintain.reconcile(maintain.ROOT, output, sha=saved['upstream_sha'],
                                     replay=saved['replay'],
                                     extra=any(c['flavor'] == 'extra' for c in saved['candidates']),
                                     nightly=any(c['channel'] == 'nightly' for c in saved['candidates']))
          maintain.require(result['outcome'] == 'unchanged', 'restored immutable run was not unchanged')
          print('Verified fresh-runner offline restoration and no-op; no live or publication certification.')
          PY
