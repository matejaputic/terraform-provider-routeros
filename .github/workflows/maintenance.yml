name: Immutable provider maintenance (offline candidates)
on:
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      upstream_sha:
        description: 'Optional immutable restraml SHA (empty resolves main once)'
        type: string
        default: ''
      extra:
        description: 'Also generate extra-package candidates (not live certification)'
        type: boolean
        default: false
      nightly:
        description: 'Include RouterOS nightly train; stale provenance fails'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: routeros-maintenance-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.8'
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.14.7'
      - name: Discover immutable snapshots, generate twice, verify and build isolated candidates
        env:
          UPSTREAM_SHA: ${{ inputs.upstream_sha }}
          INCLUDE_EXTRA: ${{ inputs.extra }}
          INCLUDE_NIGHTLY: ${{ inputs.nightly }}
        shell: bash
        run: |
          args=()
          if [[ -n "$UPSTREAM_SHA" ]]; then args+=(--sha "$UPSTREAM_SHA"); fi
          if [[ "$INCLUDE_EXTRA" == true ]]; then args+=(--extra); fi
          if [[ "$INCLUDE_NIGHTLY" == true ]]; then args+=(--nightly); fi
          python3 tools/maintenance/maintain.py "${args[@]}"
      - name: Summarize actual stage coverage (never infer live compatibility)
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('.local/maintenance/latest-summary.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Artifact-only maintenance\n\nNo live-target compatibility or release publication is certified by this job.\n\n')
              if p.exists():
                  s = json.loads(p.read_text())
                  out.write('Outcome: `' + s['outcome'] + '`\n\n')
                  out.write('| RouterOS | Flavor | Stage |\n|---|---|---|\n')
                  for c in s['candidates']:
                      out.write('| ' + c['version'] + ' | ' + c['flavor'] + ' | ' + c['status'] + ' |\n')
              else:
                  out.write('No completed summary; inspect failed setup/discovery step.\n')
          PY
      - name: Retain immutable evidence, raw inputs, checkpoints and candidate builds
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maintenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/maintenance/latest-summary.json
            .local/maintenance/checkpoints.json
            .local/maintenance/candidates/
            .local/maintenance/runs/
          if-no-files-found: warn
          # Only the dedicated offline maintenance tree, never .local/chr credentials/disks.
          include-hidden-files: true
          retention-days: 90
