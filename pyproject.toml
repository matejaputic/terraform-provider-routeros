[project]
name = "routeros-provider-tools"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
  "ruff==0.16.10",
  "ty==0.0.84",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = [
  "tools/schema/discover",
  "tools/schema/normalize",
  "tools/schema/validate",
  "tools/schema",
  "tools/maintenance",
  "tools/contracts",
  "tools/chr",
  "tools/docs",
]

[tool.ty.src]
include = ["tools"]
exclude = ["**/__pycache__/**"]
